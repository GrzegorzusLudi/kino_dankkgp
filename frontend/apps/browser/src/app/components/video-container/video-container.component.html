<div #container class="video-container" [ngClass]="theme()">
  <lib-header>{{ title() }}</lib-header>
  <div class="content">
    @if (videoId()) {
      <youtube-player
        [videoId]="videoId()"
        [width]="width()"
        [height]="height()"
        (ready)="savePlayer($event)" />
    } @else {
      <div class="no-video">
        <span class="italic">There’s no video to play yet.</span>
      </div>
    }
    <!-- TODO: (change)="onStateChange($event)" -->
  </div>
</div>
