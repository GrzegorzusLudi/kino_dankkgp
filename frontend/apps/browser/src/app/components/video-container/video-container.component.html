<div #container class="video-container">
  <lib-header>{{ title() }}</lib-header>
  <div class="content">
    @if (videoId()) {
      <youtube-player
        [videoId]="videoId()!"
        [width]="width()"
        [height]="height()"
        (ready)="savePlayer($event)" />
    } @else {
      <div class="no-video">
        <lib-text class="italic">There's no video to play yet.</lib-text>
      </div>
    }
    <!-- TODO: (change)="onStateChange($event)" -->
  </div>
</div>
