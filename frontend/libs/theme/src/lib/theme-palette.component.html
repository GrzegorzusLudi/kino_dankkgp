<!-- eslint-disable @angular-eslint/template/no-inline-styles -->
<div class="palette">
  @for (group of groups; track group.name) {
    <div class="group">
      <span class="group-name">{{ group.name }}</span>
      <div class="swatches">
        @for (swatch of group.swatches; track swatch.variable) {
          <div class="swatch">
            <div
              class="color"
              [style.background]="`var(${swatch.variable})`">
            </div>
            <span class="label">{{ swatch.variable }}</span>
            <span class="hex">{{ swatch.hex }}</span>
          </div>
        }
      </div>
    </div>
  }
</div>
